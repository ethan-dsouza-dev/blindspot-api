spring.application.name=blindspot-api
# Startup optimizations
spring.main.lazy-initialization=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jmx.JmxAutoConfiguration,\
  org.springframework.boot.autoconfigure.websocket.WebSocketMessagingAutoConfiguration,\
  org.springframework.boot.autoconfigure.websocket.WebSocketServletAutoConfiguration,\
  org.springframework.boot.autoconfigure.task.TaskExecutionAutoConfiguration,\
  org.springframework.boot.autoconfigure.task.TaskSchedulingAutoConfiguration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

google.places.api-key=${GOOGLE_PLACES_API_KEY:}
google.places.base-url=https://places.googleapis.com

geoapify.routing.api-key=${GEOAPIFY_API_KEY:}
geoapify.routing.base-url=https://api.geoapify.com

# Geoapify Routing API only supports auth via the apiKey query parameter (no header alternative),
# so RestClient DEBUG/TRACE logging must stay suppressed to avoid leaking the key in access/app logs.
logging.level.org.springframework.web.client.RestClient=INFO
logging.level.org.springframework.http.client=INFO

# --- Supabase Postgres (session pooler recommended for Hibernate compatibility) ---
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns schema creation/migration; Hibernate must never auto-generate DDL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Auth (Google Sign-In + our own JWT) ---
auth.jwt.signing-secret=${JWT_SIGNING_SECRET:}
auth.jwt.access-token-ttl-minutes=15
auth.jwt.refresh-token-ttl-days=30
auth.jwt.max-active-refresh-tokens-per-user=5
auth.google.web-client-id=${GOOGLE_OAUTH_WEB_CLIENT_ID:}
