# Test profile: in-memory H2 database so contextLoads does not need a real Postgres.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate will create/drop the schema from JPA entities; Flyway's PostgreSQL migrations are not run in tests.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Required secrets for context-load tests (JwtService validates length >= 32).
auth.jwt.signing-secret=test-signing-secret-32-characters-long
auth.google.web-client-id=test-web-client-id
